<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event tickets</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><p class="eyebrow">Your next experience</p><h1>Choose your ticket.</h1><p>One ticket per checkout. Final price and any tax are shown securely by Stripe before you pay.</p><form id="checkout"><fieldset><legend>Ticket type</legend><label><input type="radio" name="tier" value="standard" checked><span><strong>Standard</strong><small>Your seat for the experience. Enjoy the event from a standard seat and soak up the atmosphere.</small></span><span class="ticket-price">€25</span></label><label><input type="radio" name="tier" value="premium"><span><strong>Premium</strong><small>Settle into the couch area and enjoy the event with extra comfort. A more relaxed way to take it all in.</small></span><span class="ticket-price">€40</span></label><label><input type="radio" name="tier" value="vip"><span><strong>VIP</strong><small>Make a night of it with food and drinks included. Enjoy the event with the extras already taken care of.</small></span><span class="ticket-price">€60</span></label></fieldset><button id="buy">Continue to secure checkout</button><p id="message" role="status" aria-live="polite"></p><a id="resume" hidden>Check existing order</a></form><footer>Payment is handled by Stripe. Save your ticket after payment.</footer></main></body></html>
